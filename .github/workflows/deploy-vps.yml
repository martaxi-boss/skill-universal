name: Ferrari Ubuntu VPS - precheck, deploy, install
on:
  push:
    branches: [main]
    paths:
      - '.github/ferrari-readonly-precheck.request'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Choose PRECHECK, DEPLOY or INSTALL_HEADLESS'
        type: choice
        required: true
        options: [PRECHECK, DEPLOY, INSTALL_HEADLESS]
      confirm:
        description: 'Type FERRARI to confirm the selected action'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ferrari-vps-deployment
  cancel-in-progress: false
jobs:
  ferrari:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'FERRARI') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    environment: vps-motor-universal
    steps:
      - uses: actions/checkout@v4
      - name: Validate code on Ubuntu runner
        run: |
          set -euo pipefail
          # Same isolated test fixtures as ci.yml: only on the disposable GitHub runner.
          # No fixture, package or dependency is installed globally on the VPS.
          sudo install -d -m 0755 /srv/projects/skill-universal/tools/ubuntu-cli/bin
          for exe in strings file jq; do
            sudo install -m 0755 "$(command -v "$exe")" "/srv/projects/skill-universal/tools/ubuntu-cli/bin/$exe"
          done
          sudo install -d -m 0755 /srv/projects/skill-universal/tools/ubuntu-cli/share
          magic="$(find /usr/share/misc /usr/lib/file -maxdepth 2 -name magic.mgc -print -quit 2>/dev/null)"
          test -n "$magic" && test -f "$magic"
          sudo cp -L "$magic" /srv/projects/skill-universal/tools/ubuntu-cli/share/magic.mgc
          python3 -m unittest discover -s tests -v
          bash -n install/vps-preflight.sh
          bash -n install/ferrari-ubuntu.sh
      - name: Check SSH secrets and known host
        env:
          KEY: ${{ secrets.MOTOR_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.MOTOR_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.MOTOR_SSH_HOST }}
          USERNAME: ${{ secrets.MOTOR_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$KNOWN" && test -n "$HOST" && test -n "$USERNAME" || { echo 'Missing MOTOR_SSH_* secrets'; exit 2; }
          mkdir -p "$RUNNER_TEMP/ferrari-ssh"
          chmod 700 "$RUNNER_TEMP/ferrari-ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/ferrari-ssh/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/ferrari-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ferrari-ssh/key" "$RUNNER_TEMP/ferrari-ssh/known_hosts"
      - name: Read-only VPS Ubuntu preflight
        env:
          HOST: ${{ secrets.MOTOR_SSH_HOST }}
          USERNAME: ${{ secrets.MOTOR_SSH_USER }}
          PORT: ${{ secrets.MOTOR_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-i "$RUNNER_TEMP/ferrari-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-ssh/known_hosts")
          ssh "${SSH_ARGS[@]}" -p "${PORT:-22}" "$USERNAME@$HOST" 'bash -s' < install/vps-preflight.sh
      - name: Deploy isolated versioned Ferrari release
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.stage == 'DEPLOY' || inputs.stage == 'INSTALL_HEADLESS') }}
        env:
          HOST: ${{ secrets.MOTOR_SSH_HOST }}
          USERNAME: ${{ secrets.MOTOR_SSH_USER }}
          PORT: ${{ secrets.MOTOR_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-i "$RUNNER_TEMP/ferrari-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-ssh/known_hosts")
          SHA="$GITHUB_SHA"
          tar --exclude=.git --exclude=__pycache__ --exclude=.runtime -czf "$RUNNER_TEMP/source.tar.gz" .
          ssh "${SSH_ARGS[@]}" -p "${PORT:-22}" "$USERNAME@$HOST" "mkdir -p \"/srv/projects/skill-universal/releases/$SHA\""
          scp "${SSH_ARGS[@]}" -P "${PORT:-22}" "$RUNNER_TEMP/source.tar.gz" "$USERNAME@$HOST:/srv/projects/skill-universal/releases/$SHA/source.tar.gz"
          ssh "${SSH_ARGS[@]}" -p "${PORT:-22}" "$USERNAME@$HOST" "bash -s -- '$SHA'" <<'REMOTE'
          set -euo pipefail
          PROJECT="/srv/projects/skill-universal"
          RELEASE="$PROJECT/releases/$1"
          cd "$RELEASE"
          tar -xzf source.tar.gz
          rm source.tar.gz
          # Before APT installation, only verify syntax and inventory.
          # Some integration tests require binutils/ffmpeg absent on a fresh VPS.
          python3 -m compileall -q engine integrations
          python3 -m engine.ferrari doctor
          bash install/ferrari-ubuntu.sh --profile maximum --headless
          ln -sfn "$RELEASE" "$PROJECT/current.next"
          mv -Tf "$PROJECT/current.next" "$PROJECT/current"
          printf 'FERRARI_RELEASE=%s\n' "$1"
          echo 'FERRARI_DEPLOY=PASS_SOURCE_ONLY'
          REMOTE
      - name: Install approved Ubuntu headless packages and smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'INSTALL_HEADLESS' }}
        env:
          HOST: ${{ secrets.MOTOR_SSH_HOST }}
          USERNAME: ${{ secrets.MOTOR_SSH_USER }}
          PORT: ${{ secrets.MOTOR_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-i "$RUNNER_TEMP/ferrari-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-ssh/known_hosts")
          ssh "${SSH_ARGS[@]}" -p "${PORT:-22}" "$USERNAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "/srv/projects/skill-universal/current"
          if [ "$(id -u)" -eq 0 ]; then
            bash install/ferrari-ubuntu.sh --profile maximum --headless --apply
          else
            sudo -n bash install/ferrari-ubuntu.sh --profile maximum --headless --apply
          fi
          for exe in git ffmpeg pdftotext tesseract; do
            command -v "$exe" || exit 2
          done
          python3 -m unittest discover -s tests -v
          python3 -m engine.ferrari doctor
          echo 'FERRARI_APT_SMOKE=PASS'
          echo 'EXTERNAL_ENGINES=NOT_YET_INSTALLED_OR_CERTIFIED'
          REMOTE
