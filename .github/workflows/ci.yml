name: Motor Universal independent tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare project-owned CI fixtures (runner only, never VPS)
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /srv/projects/skill-universal/tools/ubuntu-cli/bin
          for exe in strings file jq; do
            src="$(command -v "$exe")"
            sudo install -m 0755 "$src" "/srv/projects/skill-universal/tools/ubuntu-cli/bin/$exe"
          done
          sudo install -d -m 0755 /srv/projects/skill-universal/tools/ubuntu-cli/share
          magic="$(find /usr/share/misc /usr/lib/file -maxdepth 2 -name magic.mgc -print -quit 2>/dev/null)"
          test -n "$magic" && test -f "$magic"
          sudo cp -L "$magic" /srv/projects/skill-universal/tools/ubuntu-cli/share/magic.mgc
      - name: Unit tests, core and Ferrari
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile install/vps-ruflo-team-real-certify.py
      - name: Validate both installers
        run: |
          bash -n install/install-ubuntu.sh
          bash -n install/ferrari-ubuntu.sh
          bash -n install/vps-preflight.sh
          bash -n install/vps-private-cad.sh
          bash -n install/vps-private-cad-smoke.sh
          bash -n install/vps-private-office.sh
          bash -n install/vps-isolated-release.sh
          bash -n install/install-agent-engines.sh
          bash -n install/vps-delivery.sh
          bash -n install/vps-android-cli-isolated.sh
          bash -n install/vps-external-agents.sh
          bash -n install/vps-specialist-engines.sh
          bash -n install/vps-cad-3d.sh
          bash -n install/vps-bim-web.sh
          bash -n install/vps-bim-web-smoke.sh
          bash -n install/vps-browser-headless.sh
          node --check engine/browser_check.js
      - name: Inspect Ferrari registry and routing
        run: |
          python3 -m engine.ferrari doctor
          python3 -m engine.ferrari plan 'Analisar APK com JADX'
          python3 -m engine.ferrari packages --profile maximum --headless
      - name: Ubuntu 24.04 free-tool APT candidate preflight (no install)
        run: bash install/ferrari-ubuntu.sh --profile maximum --headless
      - name: Ubuntu 24.04 GUI package availability (dry run; no install)
        run: bash install/ferrari-ubuntu.sh --profile maximum
      - name: Ubuntu 24.04 specialized apt candidate checks (no install)
        run: |
          for p in inkscape audacity freecad librecad openscad openshot-qt; do
            printf '%s ' "$p"
            apt-cache policy "$p" | grep -m 1 "Candidate:" || true
          done
      - name: Validate locked external releases and manifest
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          manifest=json.loads(Path('install/external-release-lock.json').read_text())
          keys={p['id']:p for p in manifest['projects']}
          assert all(x in keys for x in ['ghidra','jadx','rea','ruflo'])
          assert all(re.fullmatch('[a-f0-9]{64}',keys[x]['sha256']) for x in ('ghidra','jadx'))
          from engine import catalog_registry
          raw=json.loads(Path('engine/catalog.json').read_text())
          assert len(raw['functions']) == 277
          assert 'actions' not in raw
          assert 'names' not in raw['mcp_capabilities']
          assert all('base_operations' not in t for t in raw['tools'])
          catalog=catalog_registry.read_catalog()
          assert catalog['schema'] == 2
          selected=[x['ubuntu'] for x in catalog['tools'] if 'ubuntu' in x]
          assert catalog['ubuntu_metadata']['count'] == len(selected)
          assert all(x['certified_on_vps'] is False for x in selected)
          assert len(catalog['actions']) == 40
          assert len(catalog['providers']) == 2
          assert 'excluded_paid_or_demo_names' not in catalog['mcp_capabilities']
          assert 'excluded_paid_provider_ids' not in catalog['mcp_capabilities']
          assert 'excluded_paid_or_demo_mcp_capabilities' not in catalog['counts']
          assert catalog['counts']['mcp_source_advertised'] == 229
          assert len(catalog['mcp_capabilities']['names']) == 220
          assert catalog['counts']['all_catalog_entries'] == 455
          assert catalog['counts']['unique_tools'] == 173
          assert catalog['counts']['upstream_registry'] == 122
          assert all(t['id'] not in ('nmap', 'vscode') for t in catalog['tools'])
          assert all(p['kind'] == 'local' and p['cost'] in ('open-source', 'built-in') for p in catalog['providers'])
          print('Ferrari release/selection integrity: PASS (static only)')
          PY
      - name: Inspect original engine
        run: python3 -m engine.cli doctor

      - name: Package updated Ferrari Skill for chat installation
        shell: bash
        run: |
          set -euo pipefail
          test -f skill/motor-universal-linux/SKILL.md
          test -f skill/motor-universal-linux/agents/openai.yaml
          (cd skill && zip -q -r ../skill.zip motor-universal-linux)
          unzip -t skill.zip | tail -n 1
      - name: Publish Ferrari Skill package
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-skill-installable
          path: skill.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package same-identity Ferrari plugin update ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          plugin = json.loads(Path("packaging/motor-ferrari/plugin.json").read_text(encoding="utf-8"))
          assert plugin["interface"]["displayName"] == "motor-universal-linux"
          assert plugin["name"] == "motor-universal-linux"
          assert plugin["version"] == "1.0.11"
          skill = Path("skill/motor-universal-linux/SKILL.md").read_text(encoding="utf-8")
          assert skill.splitlines()[:2] == ["---", "name: motor-universal-linux"]
          assert Path("skill/motor-universal-linux/agents/openai.yaml").is_file()
          print("Ferrari plugin identity and Skill source: PASS")
          PY
          mkdir -p dist-plugin/.codex-plugin dist-plugin/skills
          cp packaging/motor-ferrari/plugin.json dist-plugin/.codex-plugin/plugin.json
          cp -a skill/motor-universal-linux dist-plugin/skills/
          (cd dist-plugin && zip -q -r ../ferrari-plugin-update.zip .codex-plugin skills)
          unzip -t ferrari-plugin-update.zip | tail -n 1
          skill_count="$(unzip -Z1 ferrari-plugin-update.zip | grep -Ec '^skills/[^/]+/SKILL.md$')"
          test "$skill_count" -eq 1

      - name: Publish Ferrari plugin update package
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-plugin-update
          path: ferrari-plugin-update.zip
          if-no-files-found: error
          retention-days: 14
