name: Motor Universal independent tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests, core and Ferrari
        run: python3 -m unittest discover -s tests -v
      - name: Validate both installers
        run: |
          bash -n install/install-ubuntu.sh
          bash -n install/ferrari-ubuntu.sh
      - name: Inspect Ferrari registry and routing
        run: |
          python3 -m engine.ferrari doctor
          python3 -m engine.ferrari plan 'Analisar APK com JADX'
          python3 -m engine.ferrari packages --profile maximum --headless
      - name: Ubuntu 24.04 free-tool APT candidate preflight (no install)
        run: bash install/ferrari-ubuntu.sh --profile maximum --headless
      - name: Ubuntu 24.04 GUI package availability (dry run; no install)
        run: bash install/ferrari-ubuntu.sh --profile maximum
      - name: Ubuntu 24.04 specialized apt candidate checks (no install)
        run: |
          for p in inkscape audacity freecad librecad openscad openshot-qt; do
            printf '%s ' "$p"
            apt-cache policy "$p" | grep -m 1 "Candidate:" || true
          done
      - name: Inspect original engine
        run: python3 -m engine.cli doctor
